<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>EWT Identity Card Template</title>

<!-- Google Fonts: Fraunces (serif, name/monogram), Inter (sans, labels/body), IBM Plex Mono (data/ID number) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700;9..144,900&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
  /* ---------- Design tokens: change these to re-theme the whole card ---------- */
  :root{
    --ink:#16233F;        /* primary navy - spine, headings */
    --ink-soft:#233457;   /* slightly lighter navy - secondary text */
    --gold:#B8863B;       /* brass accent - labels, rules, monogram */
    --gold-light:#D9B677; /* lighter gold - the flanking monogram letters */
    --cream:#F4EFE3;      /* parchment background */
    --white:#FFFFFF;      /* photo box background */
    --slate:#5B6472;      /* muted gray - captions, helper text */
    --teal:#2F6F62;       /* secondary accent (used in the legend swatches) */
    --line: rgba(22,35,63,0.16); /* hairline dividers */
  }

  *{box-sizing:border-box;}

  /* ---------- Page chrome (everything OUTSIDE the actual card) ---------- */
  body{
    margin:0;
    padding:56px 24px 80px;
    background:#EDEAE2;
    font-family:'Inter',sans-serif;
    color:var(--ink);
    display:flex;
    flex-direction:column;
    align-items:center;
  }
  .page-head{ text-align:center; max-width:640px; margin-bottom:44px; }
  .eyebrow{
    font-size:11px; letter-spacing:.22em; font-weight:600;
    color:var(--gold); text-transform:uppercase; margin:0 0 10px;
  }
  h1{
    font-family:'Fraunces',serif; font-weight:600; font-size:32px;
    margin:0 0 12px; letter-spacing:-.01em;
  }
  .page-head p{ font-size:14.5px; line-height:1.6; color:var(--slate); margin:0; }

  /* Row that holds the front + back card previews */
  .cards-row{
    display:flex; gap:40px; flex-wrap:wrap;
    justify-content:center; margin-bottom:36px;
  }
  .card-block{ display:flex; flex-direction:column; align-items:center; gap:14px; }
  .card-label{
    font-size:11px; letter-spacing:.18em; font-weight:600;
    color:var(--slate); text-transform:uppercase;
  }

  /* The visible "card" frame on screen - true print size is set in @media print below */
  .card-shell{
    width:405px;
    height:255px;
    border-radius:14px;
    overflow:hidden;
    box-shadow:0 1px 2px rgba(22,35,63,.08), 0 18px 34px -14px rgba(22,35,63,.35);
  }
  .card-shell svg{ display:block; width:100%; height:100%; }

  /* Design-notes panel under the cards */
  .legend{
    max-width:820px; width:100%; background:var(--white);
    border:1px solid var(--line); border-radius:14px; padding:26px 32px;
    display:grid; grid-template-columns:repeat(3, 1fr); gap:22px;
  }
  .legend h2{
    grid-column:1/-1; font-family:'Fraunces',serif; font-weight:600;
    font-size:16px; margin:0 0 2px;
  }
  .legend .item .k{
    font-size:10.5px; letter-spacing:.14em; font-weight:600;
    color:var(--gold); text-transform:uppercase; margin:0 0 4px;
  }
  .legend .item .v{ font-size:13px; color:var(--slate); line-height:1.55; margin:0; }
  .swatches{ display:flex; gap:8px; margin-top:6px; }
  .sw{ width:22px; height:22px; border-radius:6px; border:1px solid var(--line); }

  /* ---------- Print rules: hides page chrome, forces true CR80 card size ---------- */
  @media print{
    body{ background:#fff; padding:0; }
    .page-head, .legend, .card-label{ display:none; }
    .cards-row{ gap:0; margin:0; }
    .card-block{ page-break-inside:avoid; }
    .card-shell{
      width:3.375in; height:2.125in;   /* true CR80 ID card size */
      box-shadow:none; border-radius:0.12in;
    }
  }
</style>
</head>
<body>

  

  <div class="cards-row">

    <!-- ================= FRONT OF CARD ================= -->
    <div class="card-block">
      <span class="card-label">Front</span>
      <div class="card-shell">
<svg viewBox="0 0 337.5 212.5" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="EWT ID card front">
  <!-- Note on units: viewBox is 337.5 x 212.5, i.e. 100 units = 1 inch, so coordinates map directly to real card inches -->
  <defs>
    <!-- Rounded-corner mask applied to the whole card -->
    <clipPath id="fClip"><rect width="337.5" height="212.5" rx="10"/></clipPath>

    <!-- Faint diagonal hairline texture used to fill the navy spine -->
    <pattern id="fSpineTex" width="10" height="10" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="var(--ink)"/>
      <line x1="0" y1="0" x2="0" y2="10" stroke="var(--gold)" stroke-opacity="0.10" stroke-width="1"/>
    </pattern>

    <!-- Repeating low-opacity "EWT" wordmark tiled across the cream area as a security-style watermark -->
    <pattern id="fWatermark" width="46" height="46" patternTransform="rotate(-18)" patternUnits="userSpaceOnUse">
      <text x="0" y="20" font-family="Fraunces, serif" font-weight="700" font-size="13" fill="var(--gold)" fill-opacity="0.06">EWT</text>
    </pattern>
  </defs>

  <g clip-path="url(#fClip)">
    <!-- Base background -->
    <rect width="337.5" height="212.5" fill="var(--cream)"/>
    <rect width="337.5" height="212.5" fill="url(#fWatermark)"/>

    <!-- spine: the vertical navy strip on the left (95 units = 0.95in wide) -->
    <rect width="95" height="212.5" fill="url(#fSpineTex)"/>
    <rect x="93" width="2.4" height="212.5" fill="var(--gold)"/> <!-- thin gold edge line -->

    

    <!-- monogram crest: interlocking E-W-T lettering, the card's "EWT logo" placeholder -->
    <g transform="translate(47.5,50)">
      <circle r="28" fill="none" stroke="var(--gold)" stroke-width="1.6"/>
      <circle r="24" fill="none" stroke="var(--gold)" stroke-opacity="0.5" stroke-width="0.8"/>
      <text text-anchor="middle" font-family="Fraunces, serif" font-weight="500" font-size="17" fill="var(--gold-light)" x="-13" y="9">E</text>
      <text text-anchor="middle" font-family="Fraunces, serif" font-weight="700" font-size="24" fill="var(--gold)" y="10">W</text>
      <text text-anchor="middle" font-family="Fraunces, serif" font-weight="500" font-size="17" fill="var(--gold-light)" x="13" y="9">T</text>
    </g>

    <line x1="24" y1="92" x2="71" y2="92" stroke="var(--gold)" stroke-opacity="0.55" stroke-width="1"/>

    <!-- rotated vertical caption running down the spine -->
    <text x="82" y="185" text-anchor="middle" font-family="Inter" font-weight="600" font-size="7.4" letter-spacing="3" fill="var(--cream)" transform="rotate(-90 47.5 185)">IDENTITY CARD</text>

    <!-- header: card title + institution name placeholder -->
    <text x="140" y="26" font-family="Inter" font-weight="600" font-size="8.5" letter-spacing="2.4" fill="var(--gold)">OFFICIAL IDENTITY CARD</text>
    <text x="155" y="38" font-family="Inter" font-weight="400" font-size="7.6" letter-spacing="1" fill="var(--slate)">Institution name placeholder</text>

    <!-- photo placeholder: dashed box + simple silhouette icon -->
    <rect x="252" y="50" width="70" height="70" rx="6" fill="var(--white)" stroke="var(--line)" stroke-width="1.2" stroke-dasharray="3 2.6"/>
    <g transform="translate(287,75)" fill="none" stroke="var(--slate)" stroke-width="1.4">
      <circle cx="0" cy="-4" r="7"/>                         <!-- head -->
      <path d="M -12 16 C -12 4 12 4 12 16"/>                 <!-- shoulders -->
    </g>
    <text x="287" y="110" text-anchor="middle" font-family="Inter" font-weight="600" font-size="6" letter-spacing="1.6" fill="var(--slate)">PHOTO</text>

    <!-- NAME field -->
    <text x="108" y="63" font-family="Inter" font-weight="600" font-size="7.6" letter-spacing="2" fill="var(--gold)">NAME</text>
    <text x="107" y="85" font-family="Fraunces, serif" font-weight="600" font-size="20" fill="var(--ink)">Full Name</text>
    <line x1="108" y1="95" x2="235" y2="95" stroke="var(--line)" stroke-width="1"/>

    <!-- POSITION field: shown as a solid navy pill badge -->
    <text x="108" y="126" font-family="Inter" font-weight="600" font-size="7.2" letter-spacing="2" fill="var(--gold)">POSITION</text>
    <rect x="100" y="131" width="90" height="16" rx="8" fill="var(--ink)"/>
    <text x="145" y="142" text-anchor="middle" font-family="Inter" font-weight="500" font-size="10" fill="var(--cream)">Position title</text>

    <!-- DEPARTMENT field -->
    <text x="108" y="163" font-family="Inter" font-weight="600" font-size="9" letter-spacing="2" fill="var(--gold)">DEPARTMENT</text>
    <text x="108" y="178" font-family="Inter" font-weight="500" font-size="11" fill="var(--ink-soft)">Department name</text>

    <!-- ACADEMIC YEAR field: styled like a perforated ticket stub -->
    <g transform="translate(245,148)">
      <rect width="80" height="38" rx="6" fill="var(--white)" stroke="var(--gold)" stroke-width="1"/>
      <line x1="10" y1="15" x2="70" y2="15" stroke="var(--gold)" stroke-dasharray="2 2" stroke-width="1"/> <!-- perforation line -->
      <circle cx="10" cy="15" r="3" fill="var(--cream)"/>   <!-- perforation notch, left -->
      <circle cx="70" cy="15" r="3" fill="var(--cream)"/>  <!-- perforation notch, right -->
      <text x="40" y="10" text-anchor="middle" font-family="Inter" font-weight="600" font-size="6" letter-spacing="1.8" fill="var(--gold)">ACADEMIC YEAR</text>
      <text x="40" y="31" text-anchor="middle" font-family="IBM Plex Mono" font-weight="500" font-size="10.5" fill="var(--ink)">20__ &#8211; 20__</text>
    </g>
  </g>
</svg>
      </div>
    </div>

    <!-- ================= BACK OF CARD ================= -->
    <div class="card-block">
      <span class="card-label">Back</span>
      <div class="card-shell">
<svg viewBox="0 0 337.5 212.5" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="EWT ID card back">
  <defs>
    <clipPath id="bClip"><rect width="337.5" height="212.5" rx="10"/></clipPath>
    <pattern id="bSpineTex" width="10" height="10" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="var(--ink)"/>
      <line x1="0" y1="0" x2="0" y2="10" stroke="var(--gold)" stroke-opacity="0.10" stroke-width="1"/>
    </pattern>
    <pattern id="bWatermark" width="46" height="46" patternTransform="rotate(-18)" patternUnits="userSpaceOnUse">
      <text x="0" y="20" font-family="Fraunces, serif" font-weight="700" font-size="13" fill="var(--gold)" fill-opacity="0.06">EWT</text>
    </pattern>
  </defs>

  <g clip-path="url(#bClip)">
    <rect width="337.5" height="212.5" fill="var(--cream)"/>
    <rect width="337.5" height="212.5" fill="url(#bWatermark)"/>

    <!-- spine repeated for visual consistency with the front -->
    <rect width="95" height="212.5" fill="url(#bSpineTex)"/>
    <rect x="93" width="2.4" height="212.5" fill="var(--gold)"/>
    

   <g transform="translate(47.5,50)">
      <circle r="28" fill="none" stroke="var(--gold)" stroke-width="1.6"/>
      <circle r="24" fill="none" stroke="var(--gold)" stroke-opacity="0.5" stroke-width="0.8"/>
      <text text-anchor="middle" font-family="Fraunces, serif" font-weight="500" font-size="17" fill="var(--gold-light)" x="-13" y="9">E</text>
      <text text-anchor="middle" font-family="Fraunces, serif" font-weight="700" font-size="24" fill="var(--gold)" y="10">W</text>
      <text text-anchor="middle" font-family="Fraunces, serif" font-weight="500" font-size="17" fill="var(--gold-light)" x="13" y="9">T</text>
    </g>

    <line x1="24" y1="92" x2="71" y2="92" stroke="var(--gold)" stroke-opacity="0.55" stroke-width="1"/>

    <!-- rotated vertical caption running down the spine -->
    <text x="82" y="185" text-anchor="middle" font-family="Inter" font-weight="600" font-size="7.4" letter-spacing="3" fill="var(--cream)" transform="rotate(-90 47.5 185)">IDENTITY CARD</text>

    <!-- Terms of use heading + greeked placeholder text lines -->
    <text x="108" y="24" font-family="Inter" font-weight="600" font-size="8" letter-spacing="2" fill="var(--gold)">TERMS OF USE</text>
    <g fill="var(--line)">
      <rect x="108" y="32" width="205" height="4.4" rx="2.2"/>
      <rect x="108" y="41" width="195" height="4.4" rx="2.2"/>
      <rect x="108" y="50" width="200" height="4.4" rx="2.2"/>
      <rect x="108" y="59" width="150" height="4.4" rx="2.2"/>
    </g>

    <!-- "If found, return to" section with two blank lines for contact info -->
    <text x="108" y="79" font-family="Inter" font-weight="600" font-size="7.2" letter-spacing="1.6" fill="var(--gold)">IF FOUND, PLEASE RETURN TO</text>
    <line x1="108" y1="90" x2="313" y2="90" stroke="var(--line)" stroke-width="1"/>
    <line x1="108" y1="102" x2="313" y2="102" stroke="var(--line)" stroke-width="1"/>

    <!-- signature lines: card holder + authorised signatory -->
    <line x1="108" y1="135" x2="198" y2="135" stroke="var(--ink)" stroke-width="0.8"/>
    <text x="108" y="144" font-family="Inter" font-weight="500" font-size="6.4" letter-spacing="1.2" fill="var(--slate)">CARD HOLDER SIGNATURE</text>

    <line x1="222" y1="135" x2="313" y2="135" stroke="var(--ink)" stroke-width="0.8"/>
    <text x="222" y="144" font-family="Inter" font-weight="500" font-size="6.4" letter-spacing="1.2" fill="var(--slate)">AUTHORISED SIGNATORY</text>

    <!-- decorative barcode strip + placeholder number -->
    <line x1="108" y1="163" x2="313" y2="163" stroke="var(--gold)" stroke-width="1"/>
    <g transform="translate(108,172)" fill="var(--ink)">
      <!-- each rect is one barcode bar; widths vary for a realistic look, no real encoding -->
      <rect x="0" width="1.4" height="20"/><rect x="3" width="2.2" height="20"/><rect x="6.5" width="1" height="20"/>
      <rect x="9" width="1.8" height="20"/><rect x="12.5" width="1" height="20"/><rect x="15" width="2.6" height="20"/>
      <rect x="19" width="1" height="20"/><rect x="21.5" width="1.8" height="20"/><rect x="25" width="1" height="20"/>
      <rect x="27.5" width="2.2" height="20"/><rect x="31" width="1" height="20"/><rect x="33.5" width="1.6" height="20"/>
      <rect x="37" width="2.4" height="20"/><rect x="41" width="1" height="20"/><rect x="43.5" width="1.4" height="20"/>
      <rect x="47" width="1" height="20"/><rect x="49.5" width="2.2" height="20"/><rect x="53" width="1.6" height="20"/>
      <rect x="56.5" width="1" height="20"/><rect x="59" width="2.4" height="20"/><rect x="63" width="1" height="20"/>
      <rect x="65.5" width="1.8" height="20"/><rect x="69" width="1" height="20"/><rect x="71.5" width="2.2" height="20"/>
      <rect x="75.5" width="1" height="20"/><rect x="78" width="1.6" height="20"/><rect x="81.5" width="2.4" height="20"/>
      <rect x="85.5" width="1" height="20"/><rect x="88" width="1.8" height="20"/><rect x="91.5" width="1" height="20"/>
      <rect x="94" width="2.2" height="20"/><rect x="98" width="1.4" height="20"/><rect x="101" width="1" height="20"/>
      <rect x="103.5" width="2" height="20"/><rect x="107" width="1" height="20"/><rect x="109.5" width="1.6" height="20"/>
      <rect x="113" width="2.4" height="20"/><rect x="117" width="1" height="20"/><rect x="119.5" width="1.8" height="20"/>
      <rect x="123" width="1" height="20"/><rect x="125.5" width="2.2" height="20"/><rect x="129.5" width="1" height="20"/>
      <rect x="132" width="1.6" height="20"/><rect x="135.5" width="2.4" height="20"/><rect x="139.5" width="1" height="20"/>
      <rect x="142" width="1.8" height="20"/><rect x="145.5" width="1" height="20"/><rect x="148" width="2.2" height="20"/>
      <rect x="152" width="1" height="20"/><rect x="154.5" width="1.6" height="20"/><rect x="158" width="2.4" height="20"/>
      <rect x="162" width="1" height="20"/><rect x="164.5" width="1.8" height="20"/><rect x="168" width="1" height="20"/>
      <rect x="170.5" width="2.2" height="20"/><rect x="174.5" width="1" height="20"/><rect x="177" width="1.6" height="20"/>
      <rect x="180.5" width="2.4" height="20"/><rect x="184.5" width="1" height="20"/><rect x="187" width="1.8" height="20"/>
      <rect x="190.5" width="1" height="20"/><rect x="193" width="2.2" height="20"/><rect x="197" width="1.4" height="20"/>
      <rect x="200" width="1" height="20"/><rect x="202.5" width="2" height="20"/>
    </g>
    <text x="210" y="203" text-anchor="middle" font-family="IBM Plex Mono" font-weight="400" font-size="8" letter-spacing="1.5" fill="var(--slate)">0000 0000 0000</text>
  </g>
</svg>
      </div>
    </div>
  </div>
</body>
</html>
